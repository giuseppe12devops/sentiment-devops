name: sentiment-jenkins-local

services:
  jenkins:
    build: .
    image: sentiment-jenkins:local
    user: "0:0"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_data:
