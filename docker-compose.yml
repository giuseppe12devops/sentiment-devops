name: sentiment-devops

services:
  app:
    build: .
    image: sentiment-api:latest
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboard.json:/etc/grafana/dashboards/sentiment.json:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana_data:
